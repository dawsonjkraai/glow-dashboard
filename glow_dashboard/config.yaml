# The Glow Dashboard add-on (the template; scripts/release-addon.mjs fills in the version and the
# repository's address, and copies the built panel into app/).
name: Glow Dashboard
version: "0.1.2"
slug: glow_dashboard
description: A touch-first dashboard for wall tablets and phones, built from your home in a few questions.
url: "https://github.com/dawsonjkraai/glow-dashboard"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto

# In Home Assistant's sidebar, signed in as whoever opens it.
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard-variant
panel_title: Glow
panel_admin: false

# Home Assistant's API for the services the panel's screens share (album art, Music Assistant's
# queue, live WLED colours); the Supervisor's /core/info for Home Assistant's own port.
homeassistant_api: true
hassio_api: true

# Wall tablets on the home network open the dashboard on this port. On by default: without
# "no sign-in" it only serves the page and each tablet signs in with its own Home Assistant
# account. (It used to start empty, and turning on "no sign-in" alone opened nothing.)
ports:
  8199/tcp: 8199
ports_description:
  8199/tcp: Wall tablets on your home network (clear it to close the port)

options:
  no_sign_in: false
schema:
  no_sign_in: bool
